name: Deploy Demo Web

on:
  push:
    tags:
      - 'demo-web-release-*'

jobs:
  deploy:
    name: Build and Deploy Demo Web
    runs-on: org-mac
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The runner only builds. The server-side deploy script (root-owned, installed
      # from heripo-engine-server-ops) copies the build to the service account,
      # writes the runtime .env from stdin and restarts the launchd service.
      # Only NEXT_PUBLIC_* values are written here because they are inlined at
      # build time; runtime secrets never touch the runner workspace.
      - name: Write build-time public env
        run: |
          {
            printf 'NEXT_PUBLIC_PUBLIC_MODE=%s\n' "${{ vars.DEMO_WEB_PUBLIC_MODE }}"
            printf 'NEXT_PUBLIC_GA_MEASUREMENT_ID=%s\n' "${{ vars.DEMO_WEB_GA_ID }}"
            printf 'NEXT_PUBLIC_HERIPO_OFFICIAL_DEMO=%s\n' "${{ vars.DEMO_WEB_OFFICIAL_DEMO }}"
            printf 'NEXT_PUBLIC_DATA_RETENTION_DAYS=%s\n' "${{ vars.DEMO_WEB_DATA_RETENTION_DAYS }}"
            printf 'NEXT_PUBLIC_ALLOW_SAMPLE_DELETION=%s\n' "${{ vars.DEMO_WEB_ALLOW_SAMPLE_DELETION }}"
            printf 'NEXT_PUBLIC_TURNSTILE_SITE_KEY=%s\n' "${{ secrets.DEMO_WEB_TURNSTILE_SITE_KEY }}"
            printf 'NEXT_PUBLIC_APP_VERSION=%s\n' "$(node -p "require('./package.json').version")"
          } > apps/demo-web/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage build for the deploy script
        run: |
          handoff="$HOME/deploy-handoff/engine-demo"
          mkdir -p "$handoff"
          rsync -a --delete --exclude '/.git/' ./ "$handoff/"

      - name: Deploy as the service account
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          OLLAMA_BASE_URL: ${{ vars.DEMO_WEB_OLLAMA_BASE_URL }}
          LMSTUDIO_BASE_URL: ${{ vars.DEMO_WEB_LMSTUDIO_BASE_URL }}
          LMSTUDIO_API_KEY: ${{ secrets.LMSTUDIO_API_KEY }}
          PDF_PARSER_PORT: ${{ vars.DEMO_WEB_PDF_PARSER_PORT }}
          PDF_PARSER_PORT_MAX: ${{ vars.DEMO_WEB_PDF_PARSER_PORT_MAX }}
          PDF_PARSER_TIMEOUT: ${{ vars.DEMO_WEB_PDF_PARSER_TIMEOUT }}
          TOTP_SECRET: ${{ secrets.DEMO_WEB_TOTP_SECRET }}
          DAILY_LIMIT: ${{ vars.DEMO_WEB_DAILY_LIMIT }}
          OTP_MAX_ATTEMPTS: ${{ vars.DEMO_WEB_OTP_MAX_ATTEMPTS }}
          CONCURRENT_TASK_LIMIT: ${{ vars.DEMO_WEB_CONCURRENT_TASK_LIMIT }}
          WEBHOOK_URL: ${{ secrets.DEMO_WEB_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEMO_WEB_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.DEMO_WEB_TURNSTILE_SECRET_KEY }}
          UPLOAD_SESSION_SECRET: ${{ secrets.DEMO_WEB_UPLOAD_SESSION_SECRET }}
        run: |
          {
            cat apps/demo-web/.env
            for key in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY \
              TOGETHER_AI_API_KEY OLLAMA_BASE_URL LMSTUDIO_BASE_URL LMSTUDIO_API_KEY \
              PDF_PARSER_PORT PDF_PARSER_PORT_MAX PDF_PARSER_TIMEOUT TOTP_SECRET \
              DAILY_LIMIT OTP_MAX_ATTEMPTS CONCURRENT_TASK_LIMIT WEBHOOK_URL \
              WEBHOOK_SECRET TURNSTILE_SECRET_KEY UPLOAD_SESSION_SECRET; do
              printf '%s=%s\n' "$key" "${!key}"
            done
            printf 'AI_SDK_LOG_WARNINGS=false\n'
          } | sudo -n /usr/local/sbin/heripo-deploy engine-demo

      - name: Slack notification
        uses: slackapi/slack-github-action@v4
        if: always()
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ vars.SLACK_ALERT_DEV_CHANNEL }}"
            text: "${{ job.status == 'success' && '🚀 배포 완료' || '❌ 배포 실패' }}: ${{ github.repository }} (demo-web)"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *${{ job.status == 'success' && '🚀 배포 완료' || '❌ 배포 실패' }}*

                    *프로젝트:* ${{ github.repository }} (demo-web)
                    *태그:* ${{ github.ref_name }}
                    *배포자:* ${{ github.actor }}
                    *커밋:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>

                    ${{ job.status == 'success' && '✅ 데모 사이트: https://engine-demo.heripo.org' || '🚨 로그 확인이 필요합니다.' }}

                    <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 워크플로우 로그 보기>
